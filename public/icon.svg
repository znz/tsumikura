<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="つみくら">
  <!-- つみくらのアイコン。「つ」の 1 文字だけの単純な図形。**これが原本**で、
       PWA と iOS 用の PNG (icon.png / icon-192.png / icon-maskable.png /
       apple-touch-icon.png) はこのファイルから script/generate_icons.sh が作る。
       デザインを変えるときはこのファイルを直してスクリプトを実行し直す。
       maskable と apple-touch-icon は背景を全面塗りにし、図柄を安全域に収めた版を
       スクリプトが組み立てる (docs/spec/04-notifications.md 1 節)。 -->
  <rect width="512" height="512" rx="112" fill="#5B7C5A"/>
  <path d="M150 178c22-34 62-52 104-52 58 0 104 36 104 88 0 62-52 100-114 136-14 8-30 14-46 18"
        fill="none" stroke="#FAF8F3" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
