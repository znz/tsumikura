# 日本語化。activerecord.models / activerecord.attributes やビュー文言は
# モデル・画面の実装に合わせて随時追加する (docs/ops/development.md 6 節)。
ja:
  date:
    formats:
      default: "%Y/%m/%d"
  time:
    formats:
      default: "%Y/%m/%d %H:%M"

  # 廃棄・まとめ購入の入力フォーム (DB のテーブルを持たない ActiveModel)
  activemodel:
    models:
      disposal: 廃棄の記録
      purchase: まとめ購入
    attributes:
      disposal:
        quantity: 数量
        occurred_on: 廃棄日
        lot_id: ロット
        disposal_reason: 理由
        note: メモ
      purchase:
        acquired_on: 購入日
        store_id: 店舗
    errors:
      models:
        disposal:
          attributes:
            occurred_on:
              future: に未来の日付は指定できません
            quantity:
              # 廃棄は「実物を捨てた」記録なので、在庫記録を超える廃棄は作らない
              exceeds_lot: は、このロットの残り (%{remaining}) より多くできません
              exceeds_stock: は、在庫の記録 (%{available}) より多くできません
        purchase:
          attributes:
            acquired_on:
              future: に未来の日付は指定できません
            base:
              # 行ごとの詳しいエラーはその行のすぐ下に出すので、ここではどの行かだけを伝える
              line_invalid: "「%{name}」の入力を確認してください"
              no_lines: 買い物リストでチェックした品目がありません

  activerecord:
    models:
      user: ユーザー
      session: セッション
      category: カテゴリ
      storage_location: 保管場所
      store: 店舗
      item: 品目
      item_purpose: 用途
      lot: 購入の記録
      stock_movement: 在庫の記録
      usage_record: 使用の記録
      stock_take: 棚卸
      stock_take_entry: 棚卸の明細
      shopping_list_item: 買い物リストの行
      web_push_subscription: 通知の購読
      item_alert_state: 通知の状態
    attributes:
      category:
        name: 名前
        position: 並び順
      storage_location:
        name: 名前
        position: 並び順
      store:
        name: 名前
        note: メモ
      item:
        name: 名前
        name_reading: よみ
        category: カテゴリ
        category_id: カテゴリ
        storage_location: 保管場所
        storage_location_id: 保管場所
        unit: 単位
        default_pack_size: 入数の既定値
        minimum_quantity: 最低在庫数
        tracks_expiry: 期限を管理する
        tracks_purposes: 用途を管理する
        estimation_mode: 予測モード
        manual_interval_days: 使用間隔 (日)
        soon_threshold_days: そろそろ購入の日数
        urgent_threshold_days: 購入推奨の日数
        expiry_warning_days: 期限警告日数
        favorite: お気に入り
        note: メモ
        archived_at: アーカイブ
        current_quantity: 在庫数
        tracking_started_on: 記録開始日
        last_consumed_on: 最終消費日
      item_purpose:
        item: 品目
        name: 名前
        default_quantity: 既定の数量
        position: 並び順
        archived_at: アーカイブ
      usage_record:
        item: 品目
        item_purpose: 用途
        item_purpose_id: 用途
        quantity: 数量
        used_on: 使用日
        # DB には持たない (引き当て先の手動指定。既定は FEFO の自動引き当て)
        lot_id: ロット
        user: 記録者
        note: メモ
      lot:
        item: 品目
        kind: 種別
        acquired_on: 購入日
        expires_on: 期限日
        initial_quantity: 数量
        remaining_quantity: 残数
        pack_size: 入数
        pack_count: パック数
        price_yen: 金額 (税込)
        store: 店舗
        store_id: 店舗
        user: 記録者
        note: メモ
        depleted_at: 使い切った日時
      stock_movement:
        item: 品目
        lot: ロット
        kind: 種別
        quantity: 数量
        occurred_on: 日付
        disposal_reason: 廃棄理由
        user: 記録者
        note: メモ
      stock_take:
        counted_on: 棚卸日
        storage_location: 保管場所
        storage_location_id: 保管場所
        user: 記録者
        note: メモ
        finalized_at: 確定日時
      stock_take_entry:
        item: 品目
        lot: ロット
        expected_quantity: 記録在庫
        counted_quantity: 実数
        difference: 差分
      shopping_list_item:
        item: 品目
        item_id: 品目
        free_text: 自由入力
        quantity: 希望数量
        checked_at: チェック
        snoozed_until: 見送り
        added_by: 追加した人
      user:
        name: 表示名
        email_address: メールアドレス
        password: パスワード
        password_confirmation: パスワード (確認)
        role: 役割
        deactivated_at: 無効化
        notify_purchases: 購入のお知らせ
        notify_expiries: 期限のお知らせ
        created_at: 登録日時
      session:
        ip_address: IP アドレス
        user_agent: ブラウザ
        created_at: ログイン日時
      web_push_subscription:
        user: ユーザー
        endpoint: 通知の宛先
        p256dh_key: 公開鍵
        auth_key: 認証キー
        user_agent: ブラウザ
        last_delivered_at: 最終配信
        failure_count: 失敗回数
    errors:
      models:
        user:
          attributes:
            role:
              last_admin: は、管理者が 1 人しかいないため変更できません
            deactivated_at:
              last_admin: はできません (管理者が 1 人しかいません)
        item:
          attributes:
            urgent_threshold_days:
              # そろそろ購入の日数だけを上書きすると、空欄の「購入推奨の日数」にエラーが付く。
              # 何と比べて駄目なのかが分かるよう、既定値と合成したあとの実効値を両方入れる
              greater_than_soon: " (%{urgent} 日) は、そろそろ購入の日数 (%{soon} 日) 以下にしてください"
        lot:
          attributes:
            acquired_on:
              # 消費イベントが必ず今日以前にあることを予測が前提にしている
              future: に未来の日付は指定できません
            initial_quantity:
              below_consumed: は、このロットから既に使われた数 (%{consumed}) より小さくできません
            base:
              # 棚卸のマイナス差分を消すと、確定済みの棚卸の記録と消費ペースまで壊れる
              consumed: 使用・廃棄・棚卸の記録があるロットは削除できません
              # 差分 0 やプラス差分の明細には負の movement が付かないので、別に止める
              counted: 確定済みの棚卸で数えたロットは削除できません
        item_purpose:
          attributes:
            base:
              # 用途を消すと、その用途で交換した履歴と交換周期まで失われる
              used: 使用の記録がある用途は削除できません (アーカイブしてください)
        usage_record:
          attributes:
            used_on:
              # 消費イベントが必ず今日以前にあることを予測が前提にしている
              future: に未来の日付は指定できません
            item_purpose:
              mismatched_item: がこの品目の用途ではありません
        stock_movement:
          attributes:
            occurred_on:
              future: に未来の日付は指定できません
            quantity:
              must_be_positive: は入庫の記録なので 1 以上でなければなりません
              must_be_negative: は出庫の記録なので負の数でなければなりません
            item:
              mismatched_lot: がロットの品目と一致していません
        stock_take:
          attributes:
            counted_on:
              # 消費イベントが必ず今日以前にあることを予測が前提にしている
              future: に未来の日付は指定できません
            base:
              # 確定済みは調整 movement の履歴が残るので削除しない
              finalized: 確定済みの棚卸は削除できません
        stock_take_entry:
          attributes:
            lot:
              mismatched_item: がこの品目のロットではありません

  # 役割の表示名。ActiveRecord の enum には既定の i18n が無いので独自に持つ
  # (app/helpers/application_helper.rb の user_role_label)
  enums:
    user:
      role:
        member: 一般
        admin: 管理者
    item:
      estimation_mode:
        auto: 自動
        manual: 手動
        none: 予測しない
    lot:
      kind:
        purchase: 購入
        initial: 初期在庫
        adjustment: 調整
    stock_movement:
      kind:
        purchase: 入庫
        usage: 使用
        adjustment: 調整
        disposal: 廃棄
        # 棚卸の確定で入った調整は、ただの「調整」ではなく由来が分かるように出す
        stock_take: 棚卸
      disposal_reason:
        expired: 期限切れ
        damaged: 破損
        lost: 紛失
        other: その他

  # 要購入判定 (docs/spec/02-forecast.md 1 節)。AR の enum ではないので enums: の外に置く。
  # unknown は「—」で、読み上げ用の説明はビュー側 (items/_status_badges) で添える
  forecast:
    status:
      urgent: 購入推奨
      soon: そろそろ購入
      ok: 購入不要
      unknown: "—"

  # 期限判定 (docs/spec/02-forecast.md 12 節)
  expiry:
    status:
      expired: 期限切れ
      expiring_soon: 期限間近
      fresh: 期限に余裕あり
