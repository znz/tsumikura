version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  commit-message:
    prefix: "build"
    include: "scope"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  ignore:
  # json 3 は JSON.parse のオプションをキーワード引数でしか受けず、ActiveSupport 8.1.3 の
  # JSON.decode (署名付き Cookie / セッションの読み出し) が ArgumentError になる。
  # Gemfile でも 3 未満に固定している。Rails 側が対応したら、両方とも外す
  - dependency-name: json
    versions: [ ">= 3" ]
  - dependency-name: "rails"
    update-types: ["version-update:semver-major", "version-update:semver-minor"]
  allow:
  - dependency-type: all
- package-ecosystem: github-actions
  directory: "/"
  commit-message:
    prefix: "ci"
    include: "scope"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
- package-ecosystem: docker-compose
  directories:
  - "/"
  commit-message:
    prefix: "build"
    include: "scope"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
